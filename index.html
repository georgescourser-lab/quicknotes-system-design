<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>QuickNotes</h1>
        <p class="subtitle">Fast, lightweight cloud notes</p>
      </header>

      <main>
        <p id="status" role="status" aria-live="polite"></p>

        <section class="form-section">
          <h2>Add a Note</h2>
          <form id="note-form">
            <div class="form-group">
              <label for="title-input">Title</label>
              <input
                type="text"
                id="title-input"
                name="title"
                placeholder="Enter note title (required, max 100 characters)"
                maxlength="100"
                required
              />
            </div>

            <div class="form-group">
              <label for="body-input">Body</label>
              <textarea
                id="body-input"
                name="body"
                rows="4"
                placeholder="Enter note body (optional)"
              ></textarea>
            </div>

            <button type="submit" id="submit-btn">Add Note</button>
          </form>
        </section>

        <section class="notes-section">
          <div class="notes-header">
            <h2>Your Notes</h2>
            <button type="button" id="load-btn">Load notes</button>
          </div>

          <ul id="notes-list"></ul>
        </section>
      </main>

      <footer>
        <p>&copy; 2026 QuickNotes. Built with Web Foundations.</p>
      </footer>
    </div>
  </body>
</html>
